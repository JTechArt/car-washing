# Active with SPRING_PROFILES_ACTIVE=local (Cursor/VS Code Run and Debug).
# Override ports and credentials via env vars or .vscode/settings.json (lva.dev.*).
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lva}
    username: ${DB_USER:lva}
    password: ${DB_PASS:lva}
  jpa:
    show-sql: true

server:
  port: ${SERVER_PORT:9080}

lva:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-in-production-x}
    expiry-ms: ${JWT_EXPIRY_MS:86400000}

logging:
  level:
    am.lva: DEBUG
