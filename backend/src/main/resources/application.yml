spring:
  application:
    name: lva-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lva}
    username: ${DB_USER:lva}
    password: ${DB_PASS:lva}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 9080

lva:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-min-32-chars}
    expiry-ms: 86400000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
