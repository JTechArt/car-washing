version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lva
      POSTGRES_USER: lva
      POSTGRES_PASSWORD: lva
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/lva
      DB_USER: lva
      DB_PASS: lva
      JWT_SECRET: dev-secret-change-in-production
    depends_on:
      - postgres

volumes:
  pgdata:
