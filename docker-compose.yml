version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lva
      POSTGRES_USER: lva
      POSTGRES_PASSWORD: lva
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lva -d lva"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "9080:9080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/lva
      DB_USER: lva
      DB_PASS: lva
      JWT_SECRET: dev-secret-change-in-production-x
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
